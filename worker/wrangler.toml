# The pick'em contest API — src/index.js. Deployed by .github/workflows/deploy-worker.yml on
# pushes that touch worker/. One-time setup is in README.md (create the D1 database, paste its
# id below, set the two secrets).
name = "wpr-packers-pickem"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "wpr-packers-pickem"
database_id = "REPLACE-WITH-THE-ID-FROM-wrangler-d1-create"
migrations_dir = "migrations"

[vars]
SEASON = "2026"
ALLOWED_ORIGINS = "https://rowanflynnpilot.github.io,https://wausaupilotandreview.com,https://www.wausaupilotandreview.com"

# Secrets — never in this file: `wrangler secret put PIN_SALT` (any long random string; changing
# it invalidates every PIN) and `wrangler secret put ADMIN_KEY` (the export password WPR keeps).
# Local dev reads them from .dev.vars (gitignored) — copy .dev.vars.example.
